[project]
name = "llm-delusions-evals"
version = "0.1.0"
description = "Evaluation tooling for delusion-related behavior in language models."
readme = "README.md"
authors = [
    { name = "Jared Moore", email = "jlcmoore@stanford.edu" },
    { name = "Andrea Mock", email = "amock@stanford.edu" },    
    { name = "Yifan Mai", email = "yifan@cs.stanford.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75.0",
    "google-genai>=1.43.0",
    "inspect-ai>=0.3.136",
    "matplotlib>=3.9.0",
    "llm-delusions-annotations",
    "llm-delusions",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "plotly",
    "kaleido",
    "openai>=2.11.0",
    "seaborn>=0.13.0",
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "xai-sdk>=1.11.0",
]

[project.scripts]
llm-delusions-generate-report = "llm_delusions_evals.scripts.generate_report:main"
llm-delusions-serve-report = "llm_delusions_evals.scripts.serve_report:main"
llm-delusions-export-spiral-web-report = "llm_delusions_evals.scripts.export_spiral_web_report:main"

[project.optional-dependencies]
google = [
    "google-genai>=1.43.0",
]
openai = [
    "openai>=2.2.0",
]
anthropic = [
    "anthropic>=0.72.0",
]
# together = [
#   "together>=1.5.31",
# ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pylint==3.3.1",
    "ruff==0.14.0",
    "vulture>=2.15",
]

[tool.uv.sources]
llm-delusions-annotations = { git = "https://github.com/jlcmoore/llm-delusions-annotations.git" }
llm-delusions = { path = "../llm-delusions", editable = true }

[tool.ruff]
# E: pycodestyle errors, F: Pyflakes, W: pycodestyle warnings, I: isort, PL: Pylint
lint.select = ["E", "F", "W", "I", "PL"]
